version: "2"

linters:
  disable:
    # errcheck: unchecked return values (w.Write, fmt.Fprint, resp.Body.Close)
    # in Google's original frontend code — app-code work, out of scope here.
    - errcheck
    # staticcheck: deprecated API usage (io/ioutil, GCP metadata client),
    # style nits (Yoda conditions, capitalized error strings) — all in
    # upstream Google code we didn't write.
    - staticcheck
    # unused: initStats is genuine dead code in Google's main.go, same class
    # of finding already disabled for checkoutservice.
    - unused
  settings:
    govet:
      disable:
        # copylocks: false positive — genproto.Money embeds an unused
        # protobuf sync.Mutex. Same root cause as checkoutservice.
        - copylocks
        # inline: false positive from a toolchain version mismatch between
        # the declared stdlib version (go1.27.0) and this module's go.mod
        # (go1.25.0) — not a real code issue.
        - inline