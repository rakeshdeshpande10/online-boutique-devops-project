apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique
  namespace: argocd
spec:
  project: default
  source: 
    repoURL: 'https://github.com/rakeshdeshpande10/online-boutique-project.git'
    targetRevision: main
    path: helm-chart
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: online-boutique
  syncPolicy: {}